# Voice phrases for playing anything from your self-hosted library.
# Handled by the PlayLocalMusic intent_script in packages/music_voice.yaml.
#
# Custom sentences are matched before Home Assistant's built-in ones.
# Tips:
#   - Titles containing " by " ("Stand by Me") usually work anyway (the intent
#     retries the whole phrase as a title); to be explicit say
#     "play the song called stand by me".
#   - Add "in the <area>" / "on the <area>" to choose the speaker; otherwise the
#     default player configured in packages/music_voice.yaml is used.
#   - Your library is searched first, then streaming services (e.g. Spotify).
#     Add "from my library" to never use streaming, or "on Spotify" to skip the library.
#   - "Block this song" adds what's playing to the blocklist and skips it.
language: en
intents:
  PlayLocalMusic:
    data:
      # --- tracks -------------------------------------------------------------
      - sentences:
          - "play [the] (song|track) {query} by {artist} [<where>] [<from_source>]"
          - "play {query} by {artist} [<where>] [<from_source>]"
        slots:
          media_type: track
      - sentences:
          - "play [the] (song|track) {query} [<where>] [<from_source>]"
        slots:
          media_type: track
      - sentences:
          - "play [the] (song|track) (called|titled|named) {query} [<where>] [<from_source>]"
        slots:
          media_type: track
          exact_title: "true"
      # --- albums -------------------------------------------------------------
      - sentences:
          - "play [the] album {query} by {artist} [<where>] [<from_source>]"
          - "play [the] album {query} [<where>] [<from_source>]"
        slots:
          media_type: album
      # --- artists ------------------------------------------------------------
      - sentences:
          - "play [some] [music|songs] (by|from) [the] (artist|band) {query} [<where>] [<from_source>]"
          - "play [some] (music|songs) (by|from) {query} [<where>] [<from_source>]"
          - "play [the] (artist|band) {query} [<where>] [<from_source>]"
        slots:
          media_type: artist
      # --- playlists ----------------------------------------------------------
      - sentences:
          - "play [the|my] playlist {query} [<where>] [<from_source>]"
          - "play [the|my] {query} playlist [<where>] [<from_source>]"
        slots:
          media_type: playlist
      # --- radio mode (endless similar tracks) --------------------------------
      - sentences:
          - "play [something|music] (like|similar to) {query} [<where>] [<from_source>]"
        slots:
          media_type: artist
          radio: "true"

  BlockCurrentSong:
    data:
      - sentences:
          - "block (this|the current) (song|track) [<where>]"
          - "(never|don't ever) play this [song|track] again [<where>]"
          - "add this (song|track) to [my|the] (blocklist|blocked list|blocked songs)"

expansion_rules:
  where: "(in|on) [the] {area}"
  from_source: "{source}"

lists:
  source:
    values:
      - in: "from (my|the) (library|collection)"
        out: library
      - in: "only from (my|the) (library|collection)"
        out: library
      - in: "(from|on|using) spotify"
        out: streaming
  query:
    wildcard: true
  artist:
    wildcard: true
